<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Little Witch Academia - Luna Alphabet Generator (old)</title>
<style type="text/css">
@font-face {
    font-family: "My Custom Font";
    src: url(fonts/lwafont_1.otf) format("opentype");
}
textarea.customfont {
    font-family: "My Custom Font", Verdana, Tahoma;
    font-size: 35;

<script>function sync(){var normal=document.getElementById('normal');var lunanova=document.getElementById('lunanova');lunanova.value=normal.value;}</script>
</head>
<body>
<h1>Luna Alphabet Generator</h1>
<img src="assets/diana.jpg" width="120" height="150" alt="Diana"><br>
<p>Font by: <a href="https://fontstruct.com/fontstructions/show/1359073/lwa1-1">Nayas1</a> and some anons on <a href="https://desuarchive.org/a/thread/152396359#p152413854">/a/</a>.</p>
<label>Normal<br></label><textarea rows="5" name="normal" id="normal" onkeyup="sync()"></textarea><br>
<label>Luna Alphabet<br></label><textarea rows="6" name="lunanova" id="lunanova" class="customfont"></textarea>
</body>
</html>
